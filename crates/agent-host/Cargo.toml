[package]
name = "agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ACP v1 client host: spawns an ACP agent subprocess and speaks JSON-RPC over stdio"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mock-acp-agent"
path = "src/bin/mock-acp-agent.rs"
