[package]
name = "bridge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop bridge engine: relay client, policy-enforced task broker, provider registry, local store"

[dependencies]
agent-host = { path = "../agent-host" }
bridge-protocol = { path = "../bridge-protocol" }
connection-policy = { path = "../connection-policy" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
url = "2"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
